name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check all JS modules
        run: |
          for f in *.js *.mjs; do node --check "$f"; done
      - name: Run check.mjs (JSON, containers, recommender unit tests)
        run: node check.mjs
